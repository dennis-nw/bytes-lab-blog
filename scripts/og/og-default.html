<!DOCTYPE html>
<!--
  Source for /public/icons/og-default.png (1200×630), the OG card for non-post pages
  (home, about, tags). Adapted from byteslab.io/assets/og-image.html. Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --virtual-time-budget=5000 --window-size=1200,630 --screenshot=public/icons/og-default.png scripts/og/og-default.html
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500;700&display=block" rel="stylesheet">
  <style>
    :root {
      --bg:         oklch(96.5% 0.004 298);
      --text:       oklch(16%   0.005 298);
      --text-muted: oklch(42%   0.005 298);
      --text-faint: oklch(56%   0.005 298);
      --border:     oklch(84%   0.004 298);
      --accent:     #1A9B76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 72px 88px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Oversized mark bleeding off the right edge */
    .watermark {
      position: absolute;
      right: -150px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.06;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 28px;
      line-height: 1;
    }

    .wordmark .bytes { font-weight: 700; letter-spacing: 0.18em; }
    .wordmark .lab   { font-weight: 300; letter-spacing: 0.35em; }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: 76px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 24px;
    }

    .tagline {
      font-family: 'Lora', Georgia, serif;
      font-size: 30px;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 820px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      font-family: 'DM Sans', sans-serif;
      font-size: 24px;
    }

    .domain { color: var(--accent); font-weight: 500; }
    .motto  { font-family: 'Lora', Georgia, serif; font-style: italic; color: var(--text-faint); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="watermark" width="560" height="456" viewBox="138 160 236 192" aria-hidden="true">
      <g fill="none" stroke="#383838" stroke-width="23" stroke-linecap="round" stroke-linejoin="round">
        <path d="M193 172H150V340H193"/>
        <path d="M319 172H362V340H319"/>
      </g>
      <circle cx="256" cy="256" r="43" fill="#383838"/>
    </svg>

    <div class="logo">
      <svg width="74" height="60" viewBox="138 160 236 192" aria-hidden="true">
        <g fill="none" stroke="#383838" stroke-width="23" stroke-linecap="round" stroke-linejoin="round">
          <path d="M193 172H150V340H193"/>
          <path d="M319 172H362V340H319"/>
        </g>
        <circle cx="256" cy="256" r="43" fill="#1A9B76"/>
      </svg>
      <div class="wordmark">
        <span class="bytes">BYTES</span>
        <span class="lab">LAB</span>
      </div>
    </div>

    <div>
      <h1>Where Depth Meets Simplicity.</h1>
      <p class="tagline">Deep-dives into backend architecture, system design, and the lessons of shipping real software.</p>
    </div>

    <div class="footer">
      <span class="domain">blog.byteslab.io</span>
      <span class="motto">Simple, not easy.</span>
    </div>
  </div>
</body>
</html>
